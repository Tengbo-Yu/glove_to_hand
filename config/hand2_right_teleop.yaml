# Wuji Hand 2 right-hand teleop profile.
#
# Derived from wuji-retargeting v2026.8.3
# example/config/adaptive_analytical_wuji_glove_wuji_hand_2_right.yaml.
# Geometry and loss terms stay aligned with upstream.  Only the two temporal
# response values are tuned for this low-latency RDK -> host setup:
#   norm_delta 0.04 -> 0.025 (less motion deadband)
#   lp_alpha   0.2  -> 0.8   (less low-pass delay)

optimizer:
  type: "AdaptiveOptimizerAnalytical"
  urdf_path: "../wuji-retargeting/wuji_retargeting/wuji-description/hand2/body/urdf/right.urdf"
  mjcf_path: "../wuji-retargeting/wuji_retargeting/wuji-description/hand2/body/mjcf/right.xml"
  link_naming:
    prefix: "r_"
    palm: "wrist"
    fingers: [thumb, index_finger, middle_finger, ring_finger, pinky]
    pip: "{finger}_middle"
    dip: "{finger}_distal"
    tip: "{finger}_tip"
    link1: "{finger}_proximal_abd"

retarget:
  huber_delta: 2.0
  huber_delta_dir: 0.5
  norm_delta: 0.025
  w_pos: 1.0
  w_dir: 2.0
  scaling: 1.0
  w_full_hand: 1.0
  thumb_skip_pip: true
  w_hyper: 1.0
  soft_min: 0.0
  w_couple: 0.1
  couple_ratio: 0.7
  lp_alpha: 0.8

  # Tune these first in teleop_tune_hand2.sh. Orange is glove input, cyan is
  # the scaled target, and white is Hand 2 forward kinematics.
  segment_scaling:
    thumb:  [1.0, 1.0, 1.0]
    index:  [1.0, 1.0, 1.0]
    middle: [1.0, 1.0, 1.0]
    ring:   [1.0, 1.0, 1.0]
    pinky:  [1.0, 1.0, 1.0]

  pinch_thresholds:
    index:  {d1: 2.0, d2: 4.0}
    middle: {d1: 2.0, d2: 4.0}
    ring:   {d1: 2.0, d2: 4.0}
    pinky:  {d1: 2.0, d2: 4.0}
  mediapipe_rotation:
    x: 0.0
    y: 0.0
    z: -90.0
  wrist_offset_cm: [0.0, 0.0, 0.0]
  thumb_offset_cm: [0.0, 0.0, 0.0]

wuji_glove:
  device_name: "glove_r"
